# Gemini Code Assist GitHub repository review configuration (no billing activation).
# Google Cloud Developer Connect setup is required separately.
# Public GitHub repository only; never broaden to private Pryntor or Jellyfish.
have_fun: false
ignore_patterns: []
memory_config:
  disabled: true
code_review:
  disable: false
  comment_severity_threshold: LOW
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true

name: Poncho licence UI probe
on:
  push:
    branches: [test/poncho-public-macos-20261104]
    paths: [.github/workflows/poncho-native-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poncho-ui:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - name: Download and launch Poncho
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/poncho"
          MOUNT="$ROOT/mount"
          mkdir -p "$MOUNT"
          curl --fail --location --max-time 90 --proto '=https' --tlsv1.2 https://agentodo.dev/download -o "$ROOT/Poncho.dmg"
          echo "e133461fef6fa6819e0efe61b8b8bb05f94aa0b59dd45770bcb0515da0822016  $ROOT/Poncho.dmg" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$ROOT/Poncho.dmg"
          APP="$(find "$MOUNT" -maxdepth 2 -type d -name Poncho.app -print -quit)"
          test -n "$APP"
          open -na "$APP"
          sleep 7
          pgrep -fl SideTodo
      - name: Test licence-gate UI control without entering a key
        shell: bash
        run: |
          set +e
          ROOT="$RUNNER_TEMP/poncho"
          echo "=== BUTTONS_BEFORE ==="
          osascript <<'OSA'
          tell application "System Events"
            tell process "SideTodo"
              set frontmost to true
              return name of every button of window 1
            end tell
          end tell
          OSA
          echo "=== CLICK ==="
          osascript <<'OSA'
          tell application "System Events"
            tell process "SideTodo"
              set frontmost to true
              click button "I have a key" of window 1
            end tell
          end tell
          OSA
          sleep 2
          echo "=== TEXT_FIELDS_AFTER ==="
          osascript <<'OSA'
          tell application "System Events"
            tell process "SideTodo"
              return {name of every button of window 1, role description of every text field of window 1}
            end tell
          end tell
          OSA
          screencapture -x "$ROOT/key-entry-screen.png" || true
          pkill -x SideTodo || true
          sleep 1
          hdiutil detach "$ROOT/mount" || hdiutil detach -force "$ROOT/mount" || true
      - name: Upload key-entry UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poncho-key-entry-ui
          path: ${{ runner.temp }}/poncho/key-entry-screen.png
          if-no-files-found: ignore
          retention-days: 1

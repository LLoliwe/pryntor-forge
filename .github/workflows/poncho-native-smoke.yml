name: Poncho native macOS smoke
on:
  push:
    branches: [test/poncho-public-macos-20261104]
    paths: [.github/workflows/poncho-native-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poncho-smoke:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - name: Verify macOS
        shell: bash
        run: sw_vers && uname -sm && id -un
      - name: Download Poncho
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/poncho" && curl --fail --location --max-time 90 --proto '=https' --tlsv1.2 https://agentodo.dev/download -o "$RUNNER_TEMP/poncho/Poncho.dmg" && echo "e133461fef6fa6819e0efe61b8b8bb05f94aa0b59dd45770bcb0515da0822016  $RUNNER_TEMP/poncho/Poncho.dmg" | shasum -a 256 -c -
      - name: Inspect and launch Poncho
        shell: bash
        run: MOUNT="$RUNNER_TEMP/poncho/mount"; mkdir -p "$MOUNT"; hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "$RUNNER_TEMP/poncho/Poncho.dmg"; APP="$(find "$MOUNT" -maxdepth 2 -type d -name Poncho.app -print -quit)"; test -n "$APP"; codesign --verify --deep --strict --verbose=2 "$APP"; spctl --assess --verbose=2 --type execute "$APP"; open -na "$APP"; sleep 8; pgrep -fl Poncho; defaults read "$APP/Contents/Info" CFBundleIdentifier; defaults read "$APP/Contents/Info" CFBundleShortVersionString; hdiutil detach "$MOUNT"
